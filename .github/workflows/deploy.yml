name: Deploy to GitHub Pages

# 아래 브랜치에 푸시될 때마다 자동으로 GitHub Pages에 배포합니다.
on:
  push:
    branches:
      - claude/sample-quantity-dashboard-HoLll
      - main
  workflow_dispatch:   # 필요 시 Actions 탭에서 수동 실행도 가능

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포되도록 (진행 중 배포는 취소하지 않고 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 빌드 단계가 없는 정적 사이트이므로 저장소 전체를 업로드
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
